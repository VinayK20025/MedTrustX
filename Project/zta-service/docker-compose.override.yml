version: '3.8'

services:
  zta-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zta-service
    ports:
      - "8012:8012"
    networks:
      - medtrust-data
    environment:
      - ZTA_SERVICE_PORT=8012
      - IAM_DB_URL=postgresql+asyncpg://medtrust_iam_admin:iam_db_secret_2026@pg-iam:5434/iam_db
      - REDIS_URL=redis://:redis_secret_2026@medtrust-redis:6379/0
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=medtrustx
      - OPA_URL=http://opa-service:8181
      - OPA_POLICY_PATH=/v1/data/medtrust/authz/allow
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=zta-service
      - PQC_SESSION_HEADER=X-PQC-Session-Key
    volumes:
      - ./policies:/app/policies
    depends_on:
      - pg-iam
      - medtrust-redis
      - keycloak
      - opa-service
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 10s
      timeout: 5s
      retries: 5
