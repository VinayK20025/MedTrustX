  transplant-service:
    build: { context: ./services/transplant-service, dockerfile: Dockerfile }
    container_name: medtrust-transplant-service
    restart: unless-stopped
    ports: ["${TRANSPLANT_SERVICE_PORT}:3000"]
    environment:
      <<: *node-env
      DB_HOST: pg-operational
      DB_PORT: "5432"
      DB_USER: transplant_svc
      DB_PASSWORD: transplant_svc_secret
      DB_NAME: transplant_db
    depends_on:
