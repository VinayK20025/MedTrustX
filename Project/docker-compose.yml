    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  FRONTEND — Next.js 14
  # ═══════════════════════════════════════════════════════════
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    container_name: medtrust-frontend
    restart: unless-stopped
    ports: ["${FRONTEND_PORT}:3000"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KC_REALM}
      HOSTNAME: "0.0.0.0"
    depends_on: [gateway-service]
    networks: [medtrust-edge, medtrust-gateway]
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  HEALTHCARE INTEGRATIONS
  # ═══════════════════════════════════════════════════════════
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: medtrust-hapi-fhir
    restart: unless-stopped
    ports: ["8090:8080"]
    environment:
      spring.datasource.url: jdbc:postgresql://pg-clinical:5432/fhir_db
      spring.datasource.username: fhir_svc
      spring.datasource.password: fhir_svc_secret
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R4
    depends_on:
      pg-clinical: { condition: service_healthy }
    networks: [medtrust-integration, medtrust-data]
    deploy: { resources: { limits: { memory: 768M } } }
    logging: *default-logging

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: medtrust-orthanc
    restart: unless-stopped
    ports: ["8042:8042", "4242:4242"]
    environment:
      ORTHANC__REGISTERED_USERS: '{"medtrust":"${ORTHANC_PASSWORD}"}'
      ORTHANC__POSTGRESQL__HOST: pg-clinical
      ORTHANC__POSTGRESQL__PORT: 5432
      ORTHANC__POSTGRESQL__USERNAME: orthanc_svc
      ORTHANC__POSTGRESQL__PASSWORD: orthanc_svc_secret
      ORTHANC__POSTGRESQL__DATABASE: orthanc_db
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    depends_on:
      pg-clinical: { condition: service_healthy }
    networks: [medtrust-integration, medtrust-data]
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *default-logging

  emqx:
    image: emqx/emqx:latest
    container_name: medtrust-emqx
    restart: unless-stopped
    ports: ["1883:1883", "8083:8083", "18083:18083"]
    environment:
      EMQX_NAME: medtrust-emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    volumes:
      - emqx-data:/opt/emqx/data
    networks: [medtrust-integration]
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  TELEMEDICINE — Jitsi Meet Stack
  # ═══════════════════════════════════════════════════════════
  jitsi-web:
    image: jitsi/web:stable
    container_name: medtrust-jitsi-web
    restart: unless-stopped
    ports: ["${JITSI_HTTPS_PORT}:443"]
    environment:
      ENABLE_AUTH: 1
      AUTH_TYPE: jwt
      TZ: ${JITSI_TIMEZONE}
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      PUBLIC_URL: https://localhost:${JITSI_HTTPS_PORT}
    volumes:
      - jitsi-web-config:/config
      - jitsi-web-certs:/etc/letsencrypt
    depends_on: [jitsi-prosody]
    networks: [medtrust-integration]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  jitsi-prosody:
    image: jitsi/prosody:stable
    container_name: medtrust-jitsi-prosody
    restart: unless-stopped
    environment:
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      TZ: ${JITSI_TIMEZONE}
    volumes:
      - jitsi-prosody-config:/config
      - jitsi-prosody-plugins:/prosody-plugins-custom
    networks: [medtrust-integration]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    container_name: medtrust-jitsi-jicofo
    restart: unless-stopped
    environment:
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      TZ: ${JITSI_TIMEZONE}
    depends_on: [jitsi-prosody]
    networks: [medtrust-integration]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  jitsi-jvb:
    image: jitsi/jvb:stable
    container_name: medtrust-jitsi-jvb
    restart: unless-stopped
    ports: ["10000:10000/udp"]
    environment:
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_PORT: 10000
      TZ: ${JITSI_TIMEZONE}
    depends_on: [jitsi-prosody]
    networks: [medtrust-integration]
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *default-logging

  coturn:
    image: coturn/coturn:latest
    container_name: medtrust-coturn
    restart: unless-stopped
    ports: ["3478:3478", "3478:3478/udp"]
    command: ["--use-auth-secret", "--static-auth-secret=${COTURN_SECRET}", "--realm=medtrust"]
    networks: [medtrust-integration]
    deploy: { resources: { limits: { memory: 128M } } }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  COMMUNICATION
  # ═══════════════════════════════════════════════════════════
  postal:
    image: ghcr.io/postalserver/postal:latest
    container_name: medtrust-postal
    restart: unless-stopped
    ports: ["${POSTAL_SMTP_PORT}:25", "5001:5000"]
    networks: [medtrust-services]
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *default-logging

  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: medtrust-radicale
    restart: unless-stopped
    ports: ["${RADICALE_PORT}:5232"]
    volumes:
      - radicale-data:/data
    networks: [medtrust-services]
    deploy: { resources: { limits: { memory: 64M } } }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  MONITORING & OBSERVABILITY
  # ═══════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: medtrust-prometheus
    restart: unless-stopped
    ports: ["${PROMETHEUS_PORT}:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [medtrust-monitoring, medtrust-services]
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: medtrust-grafana
    restart: unless-stopped
    ports: ["${GRAFANA_PORT}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    networks: [medtrust-monitoring]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  loki:
    image: grafana/loki:latest
    container_name: medtrust-loki
    restart: unless-stopped
    ports: ["${LOKI_PORT}:3100"]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [medtrust-monitoring]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  promtail:
    image: grafana/promtail:latest
    container_name: medtrust-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [medtrust-monitoring]
    deploy: { resources: { limits: { memory: 128M } } }
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: medtrust-jaeger
    restart: unless-stopped
    ports: ["${JAEGER_UI_PORT}:16686", "${JAEGER_OTLP_PORT}:4317", "${JAEGER_COLLECTOR_PORT}:14268"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [medtrust-monitoring, medtrust-services]
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *default-logging

  wazuh:
    image: wazuh/wazuh-manager:4.8.0
    container_name: medtrust-wazuh
    restart: unless-stopped
    ports: ["${WAZUH_SYSLOG_PORT}:1514", "${WAZUH_API_PORT}:55000"]
    environment:
      INDEXER_URL: http://opensearch:9200
    volumes:
      - wazuh-data:/var/ossec/data
    networks: [medtrust-security, medtrust-monitoring]
    deploy: { resources: { limits: { memory: 768M } } }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  DEVSECOPS
  # ═══════════════════════════════════════════════════════════
  gitea:
    image: gitea/gitea:latest
    container_name: medtrust-gitea
    restart: unless-stopped
    ports: ["${GITEA_HTTP_PORT}:3000", "${GITEA_SSH_PORT}:22"]
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: pg-iam:5432
      GITEA__database__NAME: gitea_db
      GITEA__database__USER: gitea_svc
      GITEA__database__PASSWD: gitea_svc_secret
    volumes:
      - gitea-data:/data
    depends_on:
      pg-iam: { condition: service_healthy }
    networks: [medtrust-devsecops, medtrust-data]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  sonarqube:
    image: sonarqube:community
    container_name: medtrust-sonarqube
    restart: unless-stopped
    ports: ["${SONARQUBE_PORT}:9000"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://pg-iam:5432/sonarqube_db
      SONAR_JDBC_USERNAME: sonarqube_svc
      SONAR_JDBC_PASSWORD: sonarqube_svc_secret
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
    depends_on:
      pg-iam: { condition: service_healthy }
    networks: [medtrust-devsecops, medtrust-data]
    deploy: { resources: { limits: { memory: 1G } } }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  AI / ML
  # ═══════════════════════════════════════════════════════════
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: medtrust-mlflow
    restart: unless-stopped
    ports: ["${MLFLOW_PORT}:5000"]
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "${MLFLOW_BACKEND_STORE}", "--default-artifact-root", "${MLFLOW_ARTIFACT_ROOT}"]
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      pg-analytics: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *default-logging

  tf-serving:
    image: tensorflow/serving:latest
    container_name: medtrust-tf-serving
    restart: unless-stopped
    ports: ["${TF_SERVING_REST_PORT}:8501", "${TF_SERVING_GRPC_PORT}:8500"]
    volumes:
      - tf-models:/models
    environment:
      MODEL_NAME: medtrust_model
    networks: [medtrust-services]
    deploy: { resources: { limits: { memory: 1G } } }
    logging: *default-logging

# ─── NETWORKS ────────────────────────────────────────────────
networks:
  medtrust-edge:
    name: medtrust-edge
    driver: bridge
  medtrust-gateway:
    name: medtrust-gateway
    driver: bridge
  medtrust-services:
    name: medtrust-services
    driver: bridge
  medtrust-data:
    name: medtrust-data
    driver: bridge
  medtrust-monitoring:
    name: medtrust-monitoring
    driver: bridge
  medtrust-integration:
    name: medtrust-integration
    external: true
  medtrust-devsecops:
    name: medtrust-devsecops
    driver: bridge
  medtrust-security:
    name: medtrust-security
    driver: bridge

# ─── VOLUMES ─────────────────────────────────────────────────
volumes:
  pg-clinical-data:
  pg-operational-data:
  pg-iam-data:
  pg-analytics-data:
  pg-telemed-data:
  redis-data:
  redpanda-data:
  vault-data:
  step-ca-data:
  minio-data:
  clickhouse-data:
