  orthanc-data:
  emqx-data:
  jitsi-web-config:
  jitsi-web-certs:
  jitsi-prosody-config:
  jitsi-prosody-plugins:
  radicale-data:
  prometheus-data:
  grafana-data:
  loki-data:
  wazuh-data:
  gitea-data:
  sonarqube-data:
  sonarqube-extensions:
  tf-models:

