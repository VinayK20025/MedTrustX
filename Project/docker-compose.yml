# MedTrustX DHOS — Docker Compose (Part 1: Data Layer + Identity)
# Full compose file — services added incrementally

x-pg-common: &pg-common
  image: postgres:16-alpine
  restart: unless-stopped
  command: ["postgres", "-c", "wal_level=replica", "-c", "max_connections=200"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready"]
    interval: 10s
    timeout: 5s
    retries: 5

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ═══════════════════════════════════════════════════════════
  #  DATA LAYER — PostgreSQL Instances
  # ═══════════════════════════════════════════════════════════
  pg-clinical:
    <<: *pg-common
    container_name: medtrust-pg-clinical
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${PG_CLINICAL_USER}
      POSTGRES_PASSWORD: ${PG_CLINICAL_PASSWORD}
      POSTGRES_DB: patients_db
    volumes:
      - pg-clinical-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/pg-clinical-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [medtrust-data]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  pg-operational:
    <<: *pg-common
    container_name: medtrust-pg-operational
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: ${PG_OPERATIONAL_USER}
      POSTGRES_PASSWORD: ${PG_OPERATIONAL_PASSWORD}
      POSTGRES_DB: scheduling_db
    volumes:
      - pg-operational-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/pg-operational-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [medtrust-data]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  pg-iam:
    <<: *pg-common
    container_name: medtrust-pg-iam
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: ${PG_IAM_USER}
      POSTGRES_PASSWORD: ${PG_IAM_PASSWORD}
      POSTGRES_DB: iam_db
    volumes:
      - pg-iam-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/pg-iam-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [medtrust-data]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  pg-analytics:
    <<: *pg-common
    container_name: medtrust-pg-analytics
    ports: ["5435:5432"]
    environment:
      POSTGRES_USER: ${PG_ANALYTICS_USER}
      POSTGRES_PASSWORD: ${PG_ANALYTICS_PASSWORD}
      POSTGRES_DB: analytics_db
    volumes:
      - pg-analytics-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/pg-analytics-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [medtrust-data]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  pg-telemed:
    <<: *pg-common
    container_name: medtrust-pg-telemed
    ports: ["5436:5432"]
    environment:
      POSTGRES_USER: ${PG_TELEMED_USER}
      POSTGRES_PASSWORD: ${PG_TELEMED_PASSWORD}
      POSTGRES_DB: telemedicine_db
    volumes:
      - pg-telemed-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/pg-telemed-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [medtrust-data]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  REDIS
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: medtrust-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [medtrust-data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  REDPANDA (Kafka-compatible)
  # ═══════════════════════════════════════════════════════════
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: medtrust-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks: [medtrust-data]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits: { memory: 768M }
    logging: *default-logging

  redpanda-console:
    image: redpandadata/console:latest
    container_name: medtrust-redpanda-console
    restart: unless-stopped
    ports: ["8082:8080"]
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    depends_on:
      redpanda: { condition: service_healthy }
    networks: [medtrust-data]
    deploy:
      resources:
        limits: { memory: 256M }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  IDENTITY & ZTA LAYER
  # ═══════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: medtrust-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    ports: ["8080:8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      pg-iam: { condition: service_healthy }
    networks: [medtrust-gateway, medtrust-security, medtrust-data]
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 1G }
    logging: *default-logging

  opa:
    image: openpolicyagent/opa:latest-debug
    container_name: medtrust-opa
    restart: unless-stopped
    ports: ["8181:8181"]
    command: run --server --addr :8181 /policies
    volumes:
      - ./infrastructure/opa/policies:/policies:ro
    networks: [medtrust-security, medtrust-services]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
    logging: *default-logging

  vault:
    image: hashicorp/vault:1.15
    container_name: medtrust-vault
    restart: unless-stopped
    ports: ["8200:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add: [IPC_LOCK]
    volumes:
      - vault-data:/vault/data
      - ./infrastructure/vault/config:/vault/config:ro
    networks: [medtrust-security]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
    logging: *default-logging

  step-ca:
    image: smallstep/step-ca:latest
    container_name: medtrust-step-ca
    restart: unless-stopped
    ports: ["9443:9000"]
    environment:
      DOCKER_STEPCA_INIT_NAME: MedTrust CA
      DOCKER_STEPCA_INIT_DNS_NAMES: step-ca,localhost
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "true"
      DOCKER_STEPCA_INIT_ACME: "true"
    volumes:
      - step-ca-data:/home/step
    networks: [medtrust-security]
    deploy:
      resources:
        limits: { memory: 128M }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  API GATEWAY — Kong
  # ═══════════════════════════════════════════════════════════
  kong:
    image: kong:3.6
    container_name: medtrust-kong
    restart: unless-stopped
    ports:
      - "${KONG_PROXY_PORT}:8000"
      - "${KONG_PROXY_SSL_PORT}:8443"
      - "${KONG_ADMIN_PORT}:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled,correlation-id,request-transformer,response-transformer
    volumes:
      - ./infrastructure/kong/kong.yml:/etc/kong/kong.yml:ro
    networks: [medtrust-edge, medtrust-gateway, medtrust-services]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  STORAGE — MinIO
  # ═══════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: medtrust-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks: [medtrust-data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  CLICKHOUSE
  # ═══════════════════════════════════════════════════════════
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: medtrust-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "9010:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks: [medtrust-data]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  OPENSEARCH
  # ═══════════════════════════════════════════════════════════
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: medtrust-opensearch
    restart: unless-stopped
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks: [medtrust-data, medtrust-monitoring]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: medtrust-opensearch-dashboards
    restart: unless-stopped
    ports: ["5601:5601"]
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on: [opensearch]
    networks: [medtrust-monitoring]
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  PYTHON / FASTAPI MICROSERVICES (Clinical Core + Platform)
  # ═══════════════════════════════════════════════════════════
  patient-service:
    build: { context: ./services/patient-service, dockerfile: Dockerfile }
    container_name: medtrust-patient-service
    restart: unless-stopped
    ports: ["${PATIENT_SERVICE_PORT}:8000"]
    environment: &py-env
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      KEYCLOAK_URL: http://keycloak:8080
      OPA_URL: http://opa:8181
      VAULT_ADDR: ${VAULT_ADDR}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      TENANT_IDS: ${TENANT_IDS}
      DB_HOST: pg-clinical
      DB_PORT: "5432"
      DB_USER: patient_svc
      DB_PASSWORD: patient_svc_secret
      DB_NAME: patients_db
    depends_on:
      pg-clinical: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  clinical-service:
    build: { context: ./services/clinical-service, dockerfile: Dockerfile }
    container_name: medtrust-clinical-service
    restart: unless-stopped
    ports: ["${CLINICAL_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_USER: clinical_svc
      DB_PASSWORD: clinical_svc_secret
      DB_NAME: clinical_db
    depends_on:
      pg-clinical: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  diagnostics-service:
    build: { context: ./services/diagnostics-service, dockerfile: Dockerfile }
    container_name: medtrust-diagnostics-service
    restart: unless-stopped
    ports: ["${DIAGNOSTICS_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_USER: diagnostics_svc
      DB_PASSWORD: diagnostics_svc_secret
      DB_NAME: diagnostics_db
      FHIR_URL: http://hapi-fhir:8080/fhir
      ORTHANC_URL: http://orthanc:8042
    depends_on:
      pg-clinical: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data, medtrust-integration]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  pharmacy-service:
    build: { context: ./services/pharmacy-service, dockerfile: Dockerfile }
    container_name: medtrust-pharmacy-service
    restart: unless-stopped
    ports: ["${PHARMACY_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_HOST: pg-operational
      DB_PORT: "5432"
      DB_USER: pharmacy_svc
      DB_PASSWORD: pharmacy_svc_secret
      DB_NAME: pharmacy_db
    depends_on:
      pg-operational: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  nursing-service:
    build: { context: ./services/nursing-service, dockerfile: Dockerfile }
    container_name: medtrust-nursing-service
    restart: unless-stopped
    ports: ["${NURSING_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_USER: nursing_svc
      DB_PASSWORD: nursing_svc_secret
      DB_NAME: nursing_db
    depends_on:
      pg-clinical: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  ot-service:
    build: { context: ./services/ot-service, dockerfile: Dockerfile }
    container_name: medtrust-ot-service
    restart: unless-stopped
    ports: ["${OT_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_USER: ot_svc
      DB_PASSWORD: ot_svc_secret
      DB_NAME: ot_db
    depends_on:
      pg-clinical: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  icu-service:
    build: { context: ./services/icu-service, dockerfile: Dockerfile }
    container_name: medtrust-icu-service
    restart: unless-stopped
    ports: ["${ICU_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_USER: icu_svc
      DB_PASSWORD: icu_svc_secret
      DB_NAME: icu_db
      EMQX_HOST: emqx
      EMQX_PORT: "1883"
    depends_on:
      pg-clinical: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data, medtrust-integration]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  blood-bank-service:
    build: { context: ./services/blood-bank-service, dockerfile: Dockerfile }
    container_name: medtrust-blood-bank-service
    restart: unless-stopped
    ports: ["${BLOOD_BANK_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_USER: blood_bank_svc
      DB_PASSWORD: blood_bank_svc_secret
      DB_NAME: blood_bank_db
    depends_on:
      pg-clinical: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  infection-control-service:
    build: { context: ./services/infection-control-service, dockerfile: Dockerfile }
    container_name: medtrust-infection-control-service
    restart: unless-stopped
    ports: ["${INFECTION_CONTROL_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_USER: infection_ctrl_svc
      DB_PASSWORD: infection_ctrl_svc_secret
      DB_NAME: infection_control_db
    depends_on:
      pg-clinical: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  medical-records-service:
    build: { context: ./services/medical-records-service, dockerfile: Dockerfile }
    container_name: medtrust-medical-records-service
    restart: unless-stopped
    ports: ["${MEDICAL_RECORDS_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_USER: medrec_svc
      DB_PASSWORD: medrec_svc_secret
      DB_NAME: medical_records_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      pg-clinical: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  ai-service:
    build: { context: ./services/ai-service, dockerfile: Dockerfile }
    container_name: medtrust-ai-service
    restart: unless-stopped
    ports: ["${AI_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_HOST: pg-analytics
      DB_PORT: "5432"
      DB_USER: ai_svc
      DB_PASSWORD: ai_svc_secret
      DB_NAME: analytics_db
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TF_SERVING_URL: http://tf-serving:8501
    depends_on:
      pg-analytics: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data]
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *default-logging

  devices-service:
    build: { context: ./services/devices-service, dockerfile: Dockerfile }
    container_name: medtrust-devices-service
    restart: unless-stopped
    ports: ["${DEVICES_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_HOST: pg-analytics
      DB_PORT: "5432"
      DB_USER: devices_svc
      DB_PASSWORD: devices_svc_secret
      DB_NAME: devices_db
      EMQX_HOST: emqx
      EMQX_PORT: "1883"
    depends_on:
      pg-analytics: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data, medtrust-integration]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════
  #  PLATFORM / ZTA SERVICES (Python)
  # ═══════════════════════════════════════════════════════════
  iam-service:
    build: { context: ./services/iam-service, dockerfile: Dockerfile }
    container_name: medtrust-iam-service
    restart: unless-stopped
    ports: ["${IAM_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_HOST: pg-iam
      DB_PORT: "5432"
      DB_USER: iam_svc
      DB_PASSWORD: iam_svc_secret
      DB_NAME: iam_db
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/admin
    depends_on:
      pg-iam: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data, medtrust-security]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

  zta-service:
    build: { context: ./services/zta-service, dockerfile: Dockerfile }
    container_name: medtrust-zta-service
    restart: unless-stopped
    ports: ["${ZTA_SERVICE_PORT}:8000"]
    environment:
      <<: *py-env
      DB_HOST: pg-iam
      DB_PORT: "5432"
      DB_USER: zta_svc
      DB_PASSWORD: zta_svc_secret
      DB_NAME: zta_db
      OPA_URL: http://opa:8181
    depends_on:
      pg-iam: { condition: service_healthy }
      opa: { condition: service_healthy }
    networks: [medtrust-services, medtrust-data, medtrust-security]
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *default-logging

