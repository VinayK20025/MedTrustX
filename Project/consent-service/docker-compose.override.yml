version: '3.8'

services:
  consent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consent-service
    ports:
      - "8017:8017"
    networks:
      - medtrust-data
    environment:
      - CONSENT_SERVICE_PORT=8017
      - CLINICAL_DB_URL=postgresql+asyncpg://medtrust_clinical_admin:clinical_db_secret_2026@pg-clinical:5432/patients_db
      - OPERATIONAL_DB_URL=postgresql+asyncpg://medtrust_ops_admin:operational_db_secret_2026@pg-operational:5433/scheduling_db
      - REDIS_URL=redis://:redis_secret_2026@medtrust-redis:6379/0
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=medtrustx
      - AUDIT_SERVICE_URL=http://audit-service:8015
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=consent-service
      - PQC_SESSION_HEADER=X-PQC-Session-Key
    depends_on:
      - pg-clinical
      - pg-operational
      - medtrust-redis
      - keycloak
      - jaeger
      - audit-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8017/health"]
      interval: 10s
      timeout: 5s
      retries: 5
