plugins:
  - name: rate-limiting
    config:
      minute: 1000
      hour: 50000
      policy: redis
      redis_host: medtrust-redis
      redis_password: redis_secret_2026
      error_code: 429
      error_message: "Rate limit exceeded"
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
  - name: response-ratelimiting
    config:
      limits:
        sms:
          minute: 10
  - name: bot-detection
    config:
      allow: []
      deny:
        - googlebot
        - semrush
  - name: pqc-auth
  - name: tenant-injector
  - name: threat-logger
  - name: waf-rules
