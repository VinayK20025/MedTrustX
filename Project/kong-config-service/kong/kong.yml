_format_version: "3.0"

services:
  - name: patient-service
    url: http://patient-service:8018
    connect_timeout: 3000
    read_timeout: 30000
    write_timeout: 30000
    retries: 3
    routes:
      - name: patient-routes
        paths:
          - /api/patients
          - /api/patients/(?<id>\w+)
          - /api/patients/(?<id>\w+)/records
          - /fhir/r4/Patient
          - /fhir/r4/Patient/(?<id>\w+)
        strip_path: false

  - name: clinical-service
