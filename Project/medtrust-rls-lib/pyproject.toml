[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medtrust-rls-lib"
version = "1.0.0"
description = "MedTrustX Multi-Tenant Database Isolation (RLS) Library"
authors = [
    {name = "MedTrustX Engineering", email = "engineering@medtrustx.internal"},
]
dependencies = [
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "fastapi>=0.109.2",
    "starlette>=0.36.3",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]
