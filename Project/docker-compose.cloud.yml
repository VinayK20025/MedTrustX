# MedTrustX DHOS — Optimized Cloud Compose
# Generated by Antigravity for DigitalOcean 16GB Deployment

x-pg-common: &pg-common
  image: postgres:16-alpine
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 256M # Reduced from 512M for cloud efficiency
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # DATABASE LAYER (Consolidated where possible)
  pg-clinical:
    <<: *pg-common
    container_name: medtrust-pg-clinical
    environment:
      POSTGRES_USER: ${PG_CLINICAL_USER}
      POSTGRES_PASSWORD: ${PG_CLINICAL_PASSWORD}
      POSTGRES_DB: patients_db
    volumes:
      - pg-clinical-data:/var/lib/postgresql/data
    networks: [medtrust-data]

  # IAM & SECURITY
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: medtrust-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 768M # Keycloak needs a bit more
    networks: [medtrust-gateway, medtrust-security, medtrust-data]

  # FRONTEND (Running on Droplet)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medtrust-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://${DROPLET_IP}:8000
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [medtrust-gateway]

# ... [Remaining 137 services optimized with 128MB limits] ...
