version: '3.8'

services:
  iam-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iam-service
    ports:
      - "8013:8013"
    networks:
      - medtrust-data
    environment:
      - IAM_SERVICE_PORT=8013
      - IAM_DB_URL=postgresql+asyncpg://medtrust_iam_admin:iam_db_secret_2026@pg-iam:5434/iam_db
      - REDIS_URL=redis://:redis_secret_2026@medtrust-redis:6379/0
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=medtrustx
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASS=admin
      - ZTA_SERVICE_URL=http://zta-service:8012
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=iam-service
      - PQC_SESSION_HEADER=X-PQC-Session-Key
      - RP_ID=medtrustx.internal
      - RP_NAME="MedTrustX DHOS"
    depends_on:
      - pg-iam
      - medtrust-redis
      - keycloak
      - zta-service
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 10s
      timeout: 5s
      retries: 5
