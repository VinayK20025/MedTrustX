version: '3.8'

services:
  graphql-federation-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphql-federation-gateway
    ports:
      - "8023:8023"
    networks:
      - medtrust-data
    environment:
      - GRAPHQL_GATEWAY_PORT=8023
      - REDIS_URL=redis://:redis_secret_2026@medtrust-redis:6379/0
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=medtrustx
      - KEYCLOAK_CLIENT_ID=graphql-gateway-client
      - KEYCLOAK_CLIENT_SECRET=secret
      - COMPOSITION_GATEWAY_URL=http://api-composition-gateway:8022
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=graphql-federation-gateway
      - PQC_SESSION_HEADER=X-PQC-Session-Key
    depends_on:
      - api-composition-gateway
      - medtrust-redis
      - keycloak
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8023/health"]
      interval: 10s
      timeout: 5s
      retries: 5
