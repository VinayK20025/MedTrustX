version: '3.8'

services:
  clinical-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-service
    ports:
      - "8019:8019"
    networks:
      - medtrust-data
    environment:
      - CLINICAL_SERVICE_PORT=8019
      - CLINICAL_DB_URL=postgresql+asyncpg://medtrust_clinical_admin:clinical_db_secret_2026@pg-clinical:5432/patients_db
      - ANALYTICS_DB_URL=postgresql+asyncpg://medtrust_analytics_admin:analytics_db_secret_2026@pg-analytics:5435/analytics_db
      - REDIS_URL=redis://:redis_secret_2026@medtrust-redis:6379/0
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=medtrustx
      - AUDIT_SERVICE_URL=http://audit-service:8015
      - PATIENT_SERVICE_URL=http://patient-service:8018
      - AI_SERVICE_URL=http://ai-platform-service:8010
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=clinical-service
      - PQC_SESSION_HEADER=X-PQC-Session-Key
    depends_on:
      - pg-clinical
      - pg-analytics
      - medtrust-redis
      - keycloak
      - jaeger
      - audit-service
      - patient-service
      - ai-platform-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8019/health"]
      interval: 10s
      timeout: 5s
      retries: 5
