# MedTrustX Redis Configuration
# Single instance with persistence and security

# ─── Network ─────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
requirepass redis_secret_2026

# ─── Memory ──────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

# ─── Persistence (AOF + RDB) ────────────────────────────────
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# ─── Security ────────────────────────────────────────────────
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# ─── Logging ─────────────────────────────────────────────────
loglevel notice

# ─── Performance ─────────────────────────────────────────────
tcp-keepalive 300
timeout 0
databases 16
