  # ─── API Gateway Management Services ────────────────────────
  - name: kong-config-service
    url: http://kong-config-service:8021
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: kong-config-api
        paths:
          - /api/gateway/kong
          - /api/v1/kong-gateway
        strip_path: false

  - name: api-composition-gateway
    url: http://api-composition-gateway:8022
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: api-composition-api
        paths:
          - /api/gateway/composition
          - /api/gateway/discovery
          - /api/v1/api-composition
        strip_path: false

  - name: graphql-federation-gateway
    url: http://graphql-federation-gateway:8023
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: graphql-federation-api
        paths:
          - /graphql
          - /api/graphql-gateway
        strip_path: false


plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  - name: rate-limiting
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: request-transformer
    config:
      add:
        headers:
          - "X-Gateway: medtrust-kong"
          - "X-Forwarded-Proto: https"

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Tenant-ID
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600
