# MedTrustX — Kong Declarative Configuration (DB-less mode)
_format_version: "3.0"
_transform: true

services:
  # ─── Gateway Service (main aggregator) ─────────────────────
  - name: gateway
    url: http://gateway-service:3000
    routes:
      - name: gateway-api
        paths: ["/api"]
        strip_path: false

  # ─── Gateway Integration (health, dashboard, events) ──────
